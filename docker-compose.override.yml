services:

  php:
    environment:
      PHP_ENABLED_EXTENSIONS: "amqp apcu sodium redis zip pdo_pgsql pdo_mysql mysqli gd gmp"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: users_db
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - local

volumes:
  mysqldata:
    driver: local
